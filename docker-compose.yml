services:

  db:
    image: mysql:8
    container_name: flashcard-mysql
    env_file:
      - server/.env
    volumes:
      - db_data:/var/lib/mysql
      - "./server/scholarly_database.sql:/docker-entrypoint-initdb.d/scholarly_database.sql"  # Bind mount for initialization
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    expose:
      - "3306"  # Internal only (no longer exposed to public)

  backend:
    build: ./server
    container_name: flashcard-server
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - server/.env
    expose:
      - "4000"  # Internal only, reached through nginx at /api
    restart: always

  # nginx serving the built React app and proxying /api to the backend
  frontend:
    build: ./client
    container_name: flashcard-client
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: always

volumes:
  db_data:
